<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F6F3"/>
      <stop offset="1" stop-color="#FDF3E1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="300" rx="22" fill="url(#sky)"/>
  <circle cx="1080" cy="70" r="34" fill="#F2B134" opacity="0.35"/>
  <circle cx="160" cy="60" r="18" fill="#0F766E" opacity="0.10"/>
  <circle cx="640" cy="45" r="10" fill="#E4572E" opacity="0.18"/>

  <!-- Ground and road -->
  <rect x="0" y="246" width="1200" height="54" fill="#D7EDE8"/>
  <path d="M0 246 H1200" stroke="#9CCFC6" stroke-width="3"/>
  <path d="M330 272 H860" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="26 18" stroke-linecap="round"/>

  <!-- Warehouse -->
  <polygon points="60,128 190,72 320,128" fill="#1E3A5F"/>
  <rect x="72" y="126" width="236" height="120" fill="#24507F"/>
  <rect x="96" y="96" width="188" height="24" rx="5" fill="#F2B134"/>
  <text x="190" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F" letter-spacing="1.5">GIFT WHOLESALER</text>
  <rect x="150" y="166" width="80" height="80" fill="#163050"/>
  <path d="M150 182 H230 M150 198 H230 M150 214 H230 M150 230 H230" stroke="#24507F" stroke-width="3"/>
  <rect x="92" y="150" width="38" height="28" rx="3" fill="#A7D8EF"/>
  <rect x="250" y="150" width="38" height="28" rx="3" fill="#A7D8EF"/>

  <!-- Gift boxes stacked next to the warehouse -->
  <g>
    <rect x="236" y="198" width="52" height="48" rx="4" fill="#E4572E"/>
    <rect x="258" y="198" width="8" height="48" fill="#F2B134"/>
    <rect x="236" y="216" width="52" height="8" fill="#F2B134"/>
    <rect x="292" y="210" width="40" height="36" rx="4" fill="#0F766E"/>
    <rect x="308" y="210" width="8" height="36" fill="#FDF3E1"/>
    <rect x="292" y="224" width="40" height="7" fill="#FDF3E1"/>
    <rect x="252" y="160" width="40" height="38" rx="4" fill="#F2B134"/>
    <rect x="268" y="160" width="8" height="38" fill="#E4572E"/>
    <rect x="252" y="175" width="40" height="7" fill="#E4572E"/>
    <path d="M272 160 C262 146 252 152 262 160 Z M272 160 C282 146 292 152 282 160 Z" fill="#E4572E"/>
  </g>

  <!-- Delivery van -->
  <g transform="translate(470 152)">
    <rect x="0" y="22" width="150" height="72" rx="10" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="3"/>
    <path d="M150 40 H190 L222 70 V94 H150 Z" fill="#0F766E" stroke="#1E3A5F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M160 48 H186 L208 70 H160 Z" fill="#A7D8EF"/>
    <!-- gift logo on the van -->
    <rect x="48" y="38" width="54" height="40" rx="5" fill="#E4572E"/>
    <rect x="71" y="38" width="8" height="40" fill="#F2B134"/>
    <rect x="48" y="54" width="54" height="8" fill="#F2B134"/>
    <path d="M75 38 C64 24 54 30 64 38 Z M75 38 C86 24 96 30 86 38 Z" fill="#F2B134"/>
    <circle cx="40" cy="96" r="17" fill="#1E3A5F"/>
    <circle cx="40" cy="96" r="7" fill="#D7EDE8"/>
    <circle cx="180" cy="96" r="17" fill="#1E3A5F"/>
    <circle cx="180" cy="96" r="7" fill="#D7EDE8"/>
    <path d="M-34 44 H-10 M-46 62 H-14 M-30 80 H-8" stroke="#9CCFC6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Dotted path from van to shop -->
  <path d="M720 150 C780 100 820 100 880 130" fill="none" stroke="#0F766E" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round" opacity="0.7"/>

  <!-- Gift shop -->
  <rect x="880" y="120" width="250" height="126" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="3"/>
  <g>
    <path d="M868 98 H1142 L1130 128 H880 Z" fill="#E4572E"/>
    <path d="M902 98 L896 128 M948 98 L944 128 M994 98 L992 128 M1040 98 L1040 128 M1086 98 L1088 128" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M880 128 Q891 140 902 128 Q913 140 924 128 Q935 140 946 128 Q957 140 968 128 Q979 140 990 128 Q1001 140 1012 128 Q1023 140 1034 128 Q1045 140 1056 128 Q1067 140 1078 128 Q1089 140 1100 128 Q1111 140 1122 128 Q1126 136 1130 128" fill="#E4572E"/>
  </g>
  <rect x="900" y="152" width="120" height="70" rx="4" fill="#A7D8EF"/>
  <rect x="914" y="186" width="30" height="36" rx="3" fill="#F2B134"/>
  <rect x="926" y="186" width="6" height="36" fill="#E4572E"/>
  <rect x="954" y="196" width="26" height="26" rx="3" fill="#0F766E"/>
  <rect x="988" y="178" width="22" height="44" rx="3" fill="#E4572E"/>
  <rect x="1040" y="160" width="70" height="86" rx="3" fill="#1E3A5F"/>
  <circle cx="1098" cy="206" r="4" fill="#F2B134"/>
  <rect x="1046" y="140" width="58" height="16" rx="4" fill="#0F766E"/>
  <text x="1075" y="152" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="1">OPEN</text>

  <!-- Question bubble: will they order again? -->
  <g transform="translate(1010 18)">
    <rect x="0" y="0" width="168" height="62" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
    <path d="M40 62 L52 78 L60 62 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M41 60 H59" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="14" y="14" width="34" height="34" rx="5" fill="#E6F6F3" stroke="#0F766E" stroke-width="2"/>
    <rect x="14" y="14" width="34" height="10" rx="4" fill="#0F766E"/>
    <text x="31" y="43" text-anchor="middle" font-size="15" font-weight="800" fill="#E4572E">?</text>
    <text x="60" y="29" font-size="12.5" font-weight="700" fill="#1E3A5F">Will they order</text>
    <text x="60" y="46" font-size="12.5" font-weight="700" fill="#1E3A5F">again in 90 days?</text>
  </g>
</svg>
